name: Update landing page download link

# Manual fallback only.
# The canonical release flow updates docs content in scripts/release.sh after the
# hosted GitHub Release asset has been verified.

on:
  workflow_dispatch:

permissions:
  contents: write

# Paid runners require pHequals7 acting on their own work, except migration PR #698.
# The exception also requires the Blacksmith bot author and an upstream head repo.
# github.actor stays the original actor on reruns; other community/bot work stays on GitHub.
jobs:
  update-link:
    runs-on: >-
      ${{ github.repository == 'Muesli-HQ/muesli' &&
          github.actor == 'pHequals7' &&
          (!github.event.pull_request || github.event.pull_request.user.login == 'pHequals7' ||
           (github.event.pull_request.number == 698 &&
            github.event.pull_request.user.login == 'blacksmith-sh[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository)) &&
          (!github.event.issue || github.event.issue.user.login == 'pHequals7') &&
          'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Update download URL in site files
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Find the .dmg asset URL from the release
          DMG_URL=$(echo '${{ toJSON(github.event.release.assets) }}' \
            | jq -r '.[] | select(.name | endswith(".dmg")) | .browser_download_url' \
            | head -1)

          if [ -z "$DMG_URL" ]; then
            echo "No .dmg asset found in release $TAG, skipping"
            exit 0
          fi

          echo "Updating download link to: $DMG_URL"

          # Update index.html (both the <a> href and the JSON-LD downloadUrl)
          sed -i "s|https://github.com/Muesli-HQ/muesli/releases/download/[^\"]*\.dmg|$DMG_URL|g" docs/index.html

          # Update llms.txt
          sed -i "s|https://github.com/Muesli-HQ/muesli/releases/download/.*\.dmg|$DMG_URL|g" docs/llms.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/llms.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update download link to ${{ github.event.release.tag_name }}"
            git push
          fi
